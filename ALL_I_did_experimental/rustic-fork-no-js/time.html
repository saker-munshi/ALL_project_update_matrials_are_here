<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rustic Fork — Time & Shifts</title>
  <link rel="stylesheet" href="time.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo"></span> Rustic Fork <span class="sub">· KITCHEN</span></div>
  <nav class="nav">
    <a href="chef.html" >Dashboard</a>
    <a href="orders.html" >Orders</a>
    <a href="recipes.html" >Recipes</a>
    <a href="chat.html" >Chat</a>
  </nav>
  <div class="spacer"></div>
  <a href="time.html" class="shift">Off Shift</a>
  <div class="account-wrap">
    <a href="chef.html" class="avatar">E</a>
    <div class="account-name"><b>Elena K.</b><br>Kitchen · Grill Station</div>
  </div>
</header>

<main>
<div class="time-layout">
     
      <div class="clockcard">
        <div class="section-title">SHIFT CLOCK</div>
        <div class="clocktime" id="clockTime">00:00:00</div>
        <div class="tiny" id="clockDate"></div>
        <div style="margin-top:9px;color:#f28c18;font-size:10px"> GRILL STATION</div>
      <!-- <button id="clockBtn" class="clockbtn">▶️<br/>Clock In</button>-->
        <a href="time.html" class="clockbtn">Clock In</a>
        <div class="time-actions">
          <a class="btn" href="time.html">−15m</a>
          <a class="btn" href="time.html">+15m</a>
          <a class="btn" href="time.html">Reset</a>
        </div>
        <div class="tiny" style="margin-top:10px">Time is saved automatically on this device.</div>
      </div>

      
      <div class="week">
        <div class="detail-row"><b>THIS WEEK</b><span style="color:#f28c18"> <span id="weekHours">0h 00m</span> logged</span></div>
        <div class="tiny" style="margin-top:9px">Progress to 40h</div>
        <div class="bar"><i id="weekBar" style="width:0%"></i></div>
      </div>

   
      <div class="shifts"><div class="section-title">RECENT SHIFTS</div><div id="shiftRows"><div class="detail-row"><span>Today</span><span>0h 00m</span></div><div class="detail-row"><span>Yesterday</span><span>7h 30m</span></div></div></div>
    </div>
</main>
</body>
</html>
